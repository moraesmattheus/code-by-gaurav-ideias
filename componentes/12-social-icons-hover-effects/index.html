<!doctype html>
<html lang="en">
<!--
  PROJETO: Ícones de Redes Sociais com Efeito 3D Isométrico
  ORIGEM: CodeByGaurav (Gaurav Sisodiya - Tutoriais de Frontend)
  DATA DE CRIAÇÃO: 01/11/2026
  O QUE É: Conjunto de ícones das principais redes sociais que se projetam em perspectiva isométrica ao passar o mouse.
  FINALIDADE / APLICAÇÃO: Use no cabeçalho ou na página de 'Links da Bio' (estilo Linktree próprio) para aumentar seguidores das marcas.
-->

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Social icons with Hover effects | CodeByGaurav</title>
        <link rel="stylesheet" href="style.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />
    </head>
    <body>
        <ul class="wrapper">
            <li class="icon facebook">
                <span class="tooltip">Facebook</span>
                <span><i class="fa-brands fa-facebook-f"></i></span>
            </li>
            <li class="icon twitter">
                <span class="tooltip">Twitter</span>
                <span><i class="fa-brands fa-twitter"></i></span>
            </li>
            <li class="icon instgram">
                <span class="tooltip">Instgram</span>
                <span><i class="fa-brands fa-instagram"></i></span>
            </li>
            <li class="icon github">
                <span class="tooltip">Github</span>
                <span><i class="fa-brands fa-github"></i></span>
            </li>
            <li class="icon youtube">
                <span class="tooltip">Youtube</span>
                <span><i class="fa-brands fa-youtube"></i></span>
            </li>
        </ul>
    </body>
</html>
