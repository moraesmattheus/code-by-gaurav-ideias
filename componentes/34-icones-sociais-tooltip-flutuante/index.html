<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ícones Sociais com Tooltip | CodeByGaurav</title>
    <!--
      PROJETO: Ícones de Redes Sociais com Balão de Tooltip Animado
      ORIGEM: CodeByGaurav (Vídeo de Social Icons with Hover Tooltip)
      DATA: 01/11/2026
      O QUE É: Ícones circulares onde, ao passar o mouse, um balão colorido com ponta triangular sobe suavemente.
      FINALIDADE: Rodapés e cabeçalhos de sites de agências, influenciadores e empresas.
    -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <ul class="social-list">
            <li class="icon facebook">
                <span class="tooltip">Facebook</span>
                <i class="fa-brands fa-facebook-f"></i>
            </li>
            <li class="icon twitter">
                <span class="tooltip">X / Twitter</span>
                <i class="fa-brands fa-x-twitter"></i>
            </li>
            <li class="icon instagram">
                <span class="tooltip">Instagram</span>
                <i class="fa-brands fa-instagram"></i>
            </li>
            <li class="icon github">
                <span class="tooltip">GitHub</span>
                <i class="fa-brands fa-github"></i>
            </li>
            <li class="icon youtube">
                <span class="tooltip">YouTube</span>
                <i class="fa-brands fa-youtube"></i>
            </li>
        </ul>
    </div>
</body>
</html>
