<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página 404 Criativa | CodeByGaurav</title>
    <!--
      PROJETO: Página de Erro 404 com Astronauta/Planeta Flutuante
      ORIGEM: CodeByGaurav (Vídeo de 404 Page Not Found Animation)
      DATA: 01/11/2026
      O QUE É: Tela de erro 404 com efeito de gravidade zero e botão de retorno animado.
      FINALIDADE: Reter o visitante quando ele acessar um link quebrado ou campanha expirada.
    -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="error-container">
        <div class="floating-asset">
            <i class="fa-solid fa-user-astronaut astronaut-icon"></i>

        </div>

        <h1 class="error-code">404</h1>
        <h2>Oops! Você Entrou em Órbita Vazia</h2>
        <p class="error-msg">A página que você procurava não existe ou mudou de endereço nas galáxias da web.</p>

        <a href="#" class="home-btn"><i class="fa-solid fa-house"></i> Retornar para a Página Inicial</a>
    </div>

</html>
