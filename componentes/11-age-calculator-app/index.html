<!DOCTYPE html>
<html lang="en">
<!--
  PROJETO: Calculadora Precisa de Idade (Anos, Meses, Dias)
  ORIGEM: CodeByGaurav (Gaurav Sisodiya - Tutoriais de Frontend)
  DATA DE CRIAÇÃO: 01/11/2026
  O QUE É: Calculadora em tempo real que recebe data de nascimento e devolve a idade exata com validação de datas futuras.
  FINALIDADE / APLICAÇÃO: Excelente para sites de planos de saúde, seguros de vida, previdência privada ou cálculos de aposentadoria.
-->

<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator | CodeByGaurav</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="circle c1"></div>
    <div class="circle c2"></div>

    <div class="container">
        <h1>Age <span>Calculator</span></h1>

        <div class="input-group">
            <label for="date-input">Select your Birth Date</label>
            <input type="date" id="date-input">
        </div>

        <button id="calculateBtn">Calculate Now</button>

        <div class="result-box">
            <div class="result-card">
                <span id="years" class="number">--</span>
                <span class="label">Years</span>
            </div>
            <div class="result-card">
                <span id="months" class="number">--</span>
                <span class="label">Months</span>
            </div>
            <div class="result-card">
                <span id="days" class="number">--</span>
                <span class="label">Days</span>
            </div>
        </div>

        <div class="footer-text">Premium UI Design</div>

    </div>
</body>
<script src="script.js"></script>
</html>
