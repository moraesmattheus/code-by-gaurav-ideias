<!DOCTYPE html>
<html lang="en">
<!--
  PROJETO: Relógio Analógico Minimalista em Tempo Real
  ORIGEM: CodeByGaurav (Gaurav Sisodiya - Tutoriais de Frontend)
  DATA DE CRIAÇÃO: 01/11/2026
  O QUE É: Relógio analógico funcional com ponteiros de hora, minuto e segundo sincronizados com a API Date do JavaScript.
  FINALIDADE / APLICAÇÃO: Ótimo componente visual para widgets de painéis corporativos ou cabeçalhos de intranets empresariais.
-->

<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock | CodeByGaurav</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="clock">

        <div>
            <div class="info date"></div>
            <div class="info day"></div>
        </div>
        <div class="dot"></div>

        <div>
            <div class="hour-hand"></div>
            <div class="minute-hand"></div>
            <div class="second-hand"></div>
        </div>

        <div>
            <span class="h3">3</span>
            <span class="h6">6</span>
            <span class="h9">9</span>
            <span class="h12">12</span>
        </div>

        <div class="diallines"></div>
    </div>
</body>
<script src="script.js"></script>
</html>
