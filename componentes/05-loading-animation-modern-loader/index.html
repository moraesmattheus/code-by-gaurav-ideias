<head>

    <title>Loading Animation | CodeByGaurav</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="liquid-loader">
        <div class="loading-text">
            Loading

            <span class="dot">.</span>
            <span class="dot">.</span>
        </div>

            <div class="liquid-fill"></div>
        </div>
    </div>
