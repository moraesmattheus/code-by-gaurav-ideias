<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrossel Infinito de Marcas | CodeByGaurav</title>
    <!--
      PROJETO: Carrossel Infinito de Logotipos
      ORIGEM: CodeByGaurav (Tutorial de Carrossel Infinito em CSS Puro)
      DATA: 01/11/2026
      O QUE É: Faixa de rolagem contínua automática sem interrupções para marcas parceiras.
      FINALIDADE: Prova social e autoridade em landing pages e sites corporativos.
    -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="slider-container">
        <h2 class="slider-title">Tecnologias & Marcas Parceiras</h2>
        <p class="slider-subtitle">Empresas e ferramentas integradas com alto desempenho</p>
        
        <div class="logo-slider">
            <!-- Trilha de logos duplicada para transição perfeita de 0% a -50% -->
            <div class="logo-track">
                <!-- Bloco 1 de marcas -->
                <div class="logo-item"><i class="fa-brands fa-google"></i><span>Google</span></div>
                <div class="logo-item"><i class="fa-brands fa-apple"></i><span>Apple</span></div>
                <div class="logo-item"><i class="fa-brands fa-microsoft"></i><span>Microsoft</span></div>
                <div class="logo-item"><i class="fa-brands fa-amazon"></i><span>Amazon</span></div>
                <div class="logo-item"><i class="fa-brands fa-meta"></i><span>Meta</span></div>
                <div class="logo-item"><i class="fa-brands fa-spotify"></i><span>Spotify</span></div>
                <div class="logo-item"><i class="fa-brands fa-react"></i><span>React</span></div>
                <div class="logo-item"><i class="fa-brands fa-node-js"></i><span>Node.js</span></div>

                <!-- Bloco duplicado para loop contínuo -->
                <div class="logo-item"><i class="fa-brands fa-google"></i><span>Google</span></div>
                <div class="logo-item"><i class="fa-brands fa-apple"></i><span>Apple</span></div>
                <div class="logo-item"><i class="fa-brands fa-microsoft"></i><span>Microsoft</span></div>
                <div class="logo-item"><i class="fa-brands fa-amazon"></i><span>Amazon</span></div>
                <div class="logo-item"><i class="fa-brands fa-meta"></i><span>Meta</span></div>
                <div class="logo-item"><i class="fa-brands fa-spotify"></i><span>Spotify</span></div>
                <div class="logo-item"><i class="fa-brands fa-react"></i><span>React</span></div>
                <div class="logo-item"><i class="fa-brands fa-node-js"></i><span>Node.js</span></div>
            </div>
        </div>
    </div>
</body>
</html>
