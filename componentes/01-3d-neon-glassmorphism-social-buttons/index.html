<!DOCTYPE html>
<html lang="en">
<!--
  PROJETO: Botões Sociais 3D Neon Glassmorphism
  ORIGEM: CodeByGaurav (Gaurav Sisodiya - Tutoriais de Frontend)
  DATA DE CRIAÇÃO: 01/11/2026
  O QUE É: Botões tridimensionais em camadas com efeito de vidro fosco e iluminação neon colorida em hover.
  FINALIDADE / APLICAÇÃO: Ideal para barra lateral fixa de contato em landing pages de vendas ou rodapés interativos de sites institucionais.
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Neon Glassmorphism Social Buttons</title>
    <!-- FontAwesome 6.5.1 Icon Library -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="glass-container">
        <!-- Facebook Button -->
        <a href="#" class="glass-btn facebook" style="--clr: #1877f2;">
            <div class="icon-box">
                <i class="fab fa-facebook-f icon"></i>
                <span class="text">Facebook</span>
            </div>
        </a>

        <!-- X (Twitter) Button -->
        <a href="#" class="glass-btn twitter" style="--clr: #1da1f2;">
            <div class="icon-box">
                <i class="fab fa-x-twitter icon"></i>
                <span class="text">Twitter</span>
            </div>
        </a>

        <!-- Google Button -->
        <a href="#" class="glass-btn google" style="--clr: #ea4335;">
            <div class="icon-box">
                <i class="fab fa-google icon"></i>
                <span class="text">Google</span>
            </div>
        </a>

        <!-- Instagram Button -->
        <a href="#" class="glass-btn instagram" style="--clr: #e1306c;">
            <div class="icon-box">
                <i class="fab fa-instagram icon"></i>
                <span class="text">Instagram</span>
            </div>
        </a>
    </div>

</body>
</html>
