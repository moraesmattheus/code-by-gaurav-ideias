<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Neumórfica | CodeByGaurav</title>
    <!--
      PROJETO: Calculadora Neumórfica (Neumorphism / Soft UI)
      ORIGEM: CodeByGaurav (Projeto Clássico de Interface Suave)
      DATA: 01/11/2026
      O QUE É: Calculadora funcional com sombras suaves e relevo realista.
      FINALIDADE: Estudo avançado de box-shadow e interatividade matemática.
    -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <input type="text" id="result" placeholder="0" readonly>
        </div>
        <div class="buttons">
            <button class="btn action" onclick="clearDisplay()">AC</button>
            <button class="btn action" onclick="deleteChar()">DEL</button>
            <button class="btn operator" onclick="appendOp('%')">%</button>
            <button class="btn operator highlight" onclick="appendOp('/')">/</button>

            <button class="btn" onclick="appendNum('7')">7</button>
            <button class="btn" onclick="appendNum('8')">8</button>
            <button class="btn" onclick="appendNum('9')">9</button>
            <button class="btn operator highlight" onclick="appendOp('*')">×</button>

            <button class="btn" onclick="appendNum('4')">4</button>
            <button class="btn" onclick="appendNum('5')">5</button>
            <button class="btn" onclick="appendNum('6')">6</button>
            <button class="btn operator highlight" onclick="appendOp('-')">-</button>

            <button class="btn" onclick="appendNum('1')">1</button>
            <button class="btn" onclick="appendNum('2')">2</button>
            <button class="btn" onclick="appendNum('3')">3</button>
            <button class="btn operator highlight" onclick="appendOp('+')">+</button>

            <button class="btn" onclick="appendNum('0')">0</button>
            <button class="btn" onclick="appendNum('00')">00</button>
            <button class="btn" onclick="appendNum('.')">.</button>
            <button class="btn equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
