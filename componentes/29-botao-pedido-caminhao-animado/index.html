<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botão de Pedido com Caminhão Animado | CodeByGaurav</title>
    <!--
      PROJETO: Botão de Finalizar Compra com Animação de Caminhão de Entrega
      ORIGEM: CodeByGaurav (Vídeo Viral de Order Button Animation)
      DATA: 01/11/2026
      O QUE É: Botão que, ao ser clicado, se transforma num caminhão que carrega a caixa e acelera pela tela.
      FINALIDADE: Aumentar a dopamina e a certeza de compra no checkout de e-commerces.
    -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="checkout-box">
        <h2>Confirmação do Pedido</h2>
        <p class="desc">Clique abaixo para despachar o seu pacote para entrega expressa.</p>

        <button class="order-btn" id="orderBtn">
            <span class="default-text">Confirmar e Enviar Pedido</span>
            <span class="success-text">Pedido Despachado!</span>
            
            <div class="truck-box">
                <div class="box-parcel"></div>
                <div class="truck">
                    <div class="truck-body"></div>
                    <div class="truck-cab"></div>
                    <div class="wheel wheel-front"></div>
                    <div class="wheel wheel-back"></div>
                </div>
            </div>
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
