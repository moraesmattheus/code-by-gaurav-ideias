<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card de Produto 3D Flutuante | CodeByGaurav</title>
    <!--
      PROJETO: Vitrine de Produto 3D com Imagem Flutuante e Sombra Dinâmica
      ORIGEM: CodeByGaurav (Vídeo de Pepsi & Product Card Animation)
      DATA: 01/11/2026
      O QUE É: Card onde o produto salta para fora do card ao passar o mouse, com troca de cor e sombra realista.
      FINALIDADE: Aumentar taxa de conversão em e-commerces e catálogos de produtos físicos.
    -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="product-card">
        <div class="circle-bg"></div>
        <div class="img-box">
            <img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?auto=format&fit=crop&w=400&q=80" alt="Smartwatch Ultra Edition">
        </div>
        <div class="content-box">
            <h2>Chronos Ultra V2</h2>
            <p class="tagline">Titanium Edition • Bateria 14 Dias</p>
            <div class="price-row">
                <span class="old-price">R$ 1.299</span>
                <span class="new-price">R$ 849</span>
            </div>
            <button class="buy-btn"><i class="fa-solid fa-cart-shopping"></i> Comprar Agora</button>
        </div>
    </div>
</body>
</html>
