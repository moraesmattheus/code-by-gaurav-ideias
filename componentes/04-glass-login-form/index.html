<!DOCTYPE html>
<html lang="en">
<!--
  PROJETO: Login Glassmorphism com Desfoque Real
  ORIGEM: CodeByGaurav (Gaurav Sisodiya - Tutoriais de Frontend)
  DATA DE CRIAÇÃO: 01/11/2026
  O QUE É: Design premium com desfoque de fundo (backdrop-filter: blur), bordas semi-transparentes e sombras suaves.
  FINALIDADE / APLICAÇÃO: Excelente para sites de alto padrão (ex.: consultoria imobiliária, escritórios de advocacia ou marcas de luxo).
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form | CodeByGaurav</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <form action="" class="login-form">
        <h1 class="login-title">Login</h1>

        <div class="input-box">
            <i class="fa-solid fa-user"></i>
            <input type="text" placeholder="Username">
        </div>
        <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input type="password" placeholder="Password">
        </div>
        
        <div class="remember-forgot-box">
            <label for="remember">
                <input type="checkbox" id="remember">
                Remember me
            </label>
            <a href="#">Forgot Password</a>
        </div>

        <button class="login-btn">Login</button>
        <p class="register">
            Don't have an account?
            <a href="#">Register</a>
        </p>
    </form>
</body>
</html>
