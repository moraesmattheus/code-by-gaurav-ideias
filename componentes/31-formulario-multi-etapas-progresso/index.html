<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Multi-Etapas | CodeByGaurav</title>
    <!--
      PROJETO: Formulário em Etapas com Barra de Progresso
      ORIGEM: CodeByGaurav (Vídeo de Multi Form Setup & Progress Steps)
      DATA: 01/11/2026
      O QUE É: Formulário dividido em passos sequenciais (Conta, Pessoal, Pagamento) para não sobrecarregar o usuário.
      FINALIDADE: Aumentar a taxa de conclusão de cadastros longos e orçamentos.
    -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="multistep-card">
        <!-- Indicador de Passos -->
        <div class="steps-indicator">
            <div class="step-item active" id="step1-dot">
                <div class="step-num">1</div>
                <span>Perfil</span>
            </div>
            <div class="step-line" id="line1"></div>
            <div class="step-item" id="step2-dot">
                <div class="step-num">2</div>
                <span>Contato</span>
            </div>
            <div class="step-line" id="line2"></div>
            <div class="step-item" id="step3-dot">
                <div class="step-num">3</div>
                <span>Confirmar</span>
            </div>
        </div>

        <!-- Passo 1 -->
        <div class="form-step active" id="step1">
            <h3>Informações Básicas</h3>
            <p class="step-desc">Preencha seus dados para criar sua conta de membro.</p>
            <div class="input-box">
                <label>Nome Completo</label>
                <input type="text" placeholder="Ex: Mattheus Moraes">
            </div>
            <div class="input-box">
                <label>Nome de Usuário</label>
                <input type="text" placeholder="Ex: marez.dev">
            </div>
            <button class="next-btn" onclick="nextStep(2)">Avançar <i class="fa-solid fa-arrow-right"></i></button>
        </div>

        <!-- Passo 2 -->
        <div class="form-step" id="step2">
            <h3>Dados de Contato</h3>
            <p class="step-desc">Onde enviaremos as notificações e relatórios de tráfego.</p>
            <div class="input-box">
                <label>E-mail Corporativo</label>
                <input type="email" placeholder="contato@empresa.com">
            </div>
            <div class="input-box">
                <label>WhatsApp</label>
                <input type="tel" placeholder="(11) 99999-9999">
            </div>
            <div class="btn-row">
                <button class="prev-btn" onclick="nextStep(1)"><i class="fa-solid fa-arrow-left"></i> Voltar</button>
                <button class="next-btn" onclick="nextStep(3)">Avançar <i class="fa-solid fa-arrow-right"></i></button>
            </div>
        </div>

        <!-- Passo 3 -->
        <div class="form-step" id="step3">
            <div class="success-icon"><i class="fa-solid fa-check"></i></div>
            <h3>Tudo Pronto!</h3>
            <p class="step-desc">Revise seus dados e conclua o cadastro com segurança.</p>
            <button class="next-btn finish-btn" onclick="alert('Cadastro finalizado com sucesso!')">Finalizar Cadastro</button>
            <button class="prev-btn" onclick="nextStep(2)" style="width:100%; margin-top: 10px;">Revisar Dados</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
